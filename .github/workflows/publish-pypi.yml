name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          git branch -r --contains HEAD | grep -q 'origin/main'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump versions in pyproject.toml files
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for f in packages/*/pyproject.toml; do
            sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" "$f"
          done

      - name: Build all packages
        run: |
          for pkg in packages/trace-agent-sdk packages/trace-agent-server packages/trace-agent-langchain packages/trace-agent-ui; do
            uv build --package $(basename "$pkg")
          done

      - name: List built artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
