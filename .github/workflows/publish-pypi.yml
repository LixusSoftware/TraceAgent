name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          git branch -r --contains HEAD | grep -q 'origin/main'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump versions in pyproject.toml files
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for f in packages/*/pyproject.toml; do
            sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" "$f"
          done

      - name: Build all packages
        run: |
          for pkg in packages/trace-agent-sdk packages/trace-agent-server packages/trace-agent-langchain packages/trace-agent-pydantic-ai packages/trace-agent-ui; do
            uv build --package $(basename "$pkg")
          done

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags with a suffix (e.g. v1.2.3-rc1) are published as pre-releases
          PRERELEASE=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${PRERELEASE}
