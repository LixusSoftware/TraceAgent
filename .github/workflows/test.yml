name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --extra dev --extra providers --extra langchain

      - name: Run server tests
        run: uv run --package trace-agent-server pytest packages/trace-agent-server/tests -v --cov=trace_agent_server --cov-report=xml

      - name: Run langchain tests
        run: uv run --package trace-agent-langchain pytest packages/trace-agent-langchain/tests -v
