version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: trace-agent-server
    ports:
      - "8000:8000"
    environment:
      - TRACE_AGENT_DATABASE_URL=sqlite:///./data/trace_agent.db
      - TRACE_AGENT_AUDIT_METRICS_ENABLED=true
    volumes:
      - trace-agent-data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: trace-agent-ui
    ports:
      - "8080:8080"
    environment:
      - TRACE_AGENT_SERVER_URL=http://server:8000
      - TRACE_AGENT_UI_HOST=0.0.0.0
      - TRACE_AGENT_UI_PORT=8080
    depends_on:
      - server

volumes:
  trace-agent-data:
