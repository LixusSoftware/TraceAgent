[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent-server"
version = "0.1.0"
description = "TraceAgent FastAPI backend server."
readme = "README.md"
authors = [
  { name = "Enrique Javier Villar Cea", email = "villarcea.enriquejavier@gmail.com" },
  { name = "Javier Rodriguez Castellano", email = "javirodriguezcastellano@gmail.com" },
]
license = { text = "MIT" }
keywords = ["agent", "observability", "tracing", "llm", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"
dependencies = [
  "trace-agent-sdk",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "openai>=1.52.0,<2.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "sqlalchemy>=2.0.32,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/LixusSoftware/TraceAgent"
Repository = "https://github.com/LixusSoftware/TraceAgent"
Issues = "https://github.com/LixusSoftware/TraceAgent/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
]
providers = [
  "anthropic>=0.42.0",
  "google-generativeai>=0.8.0",
]
langchain = [
  "trace-agent-langchain",
]

[project.scripts]
trace-agent-server = "trace_agent_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=trace_agent_server --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["trace_agent_server"]
omit = ["*/tests/*", "*/test_*"]
