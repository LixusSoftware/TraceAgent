[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent-ui"
version = "0.1.0"
description = "TraceAgent UI static server."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.scripts]
trace-agent-ui = "trace_agent_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_agent_ui = ["static/**/*", "static/assets/**/*"]
