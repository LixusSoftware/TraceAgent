[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent-ui"
version = "0.1.0"
description = "TraceAgent UI static server."
authors = [
  { name = "Enrique Javier Villar Cea", email = "villarcea.enriquejavier@gmail.com" },
  { name = "Javier Rodriguez Castellano", email = "javirodriguezcastellano@gmail.com" },
]
license = { text = "MIT" }
keywords = ["agent", "observability", "tracing", "llm", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/LixusSoftware/TraceAgent"
Repository = "https://github.com/LixusSoftware/TraceAgent"
Issues = "https://github.com/LixusSoftware/TraceAgent/issues"

[project.scripts]
trace-agent-ui = "trace_agent_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_agent_ui = ["static/**/*", "static/assets/**/*"]
